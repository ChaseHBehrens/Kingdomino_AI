name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: kingdomino-ai-linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: kingdomino-ai-windows.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: kingdomino-ai-macos

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }} --bin play
        env:
          # Override target-cpu=native from .cargo/config.toml so the binary runs on any modern x86-64 CPU
          RUSTFLAGS: -C target-cpu=x86-64-v2

      - name: Stage Artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/play.exe dist/${{ matrix.asset_name }}
          else
            cp target/${{ matrix.target }}/release/play dist/${{ matrix.asset_name }}
          fi

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
